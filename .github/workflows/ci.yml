name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            medallion/python/requirements.txt
            medallion/analysis/requirements.txt

      - name: Install dependencies
        run: pip install -r medallion/python/requirements.txt -r medallion/analysis/requirements.txt

      - name: Bronze ingest tests (B1-B6)
        working-directory: medallion/python
        run: pytest -v


  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build